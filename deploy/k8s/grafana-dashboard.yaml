---
# Grafana sidecar (`grafana-sc-dashboard`) は label `grafana_dashboard: "1"` の
# ConfigMap を全 NS で監視し、自動で Grafana に dashboard を import する.
# 設定: kube-prometheus-stack values.yaml の grafana.sidecar.dashboards.searchNamespace = ALL
apiVersion: v1
kind: ConfigMap
metadata:
  name: ta-agent-dashboard
  namespace: telemetry-analyst
  labels:
    app: ta-agent
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Telemetry Analyst"
data:
  agent-health.json: |
    {
      "uid": "ta-agent-health",
      "title": "Telemetry Analyst — Agent Health",
      "tags": [
        "telemetry-analyst",
        "agent",
        "ai",
        "llm",
        "ec-shop"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROM",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          },
          {
            "name": "mode",
            "label": "Mode",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROM}"
            },
            "query": "label_values(ta_agent_response_latency_seconds_bucket, mode)",
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Health (overall)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "Response latency percentiles (mode=$mode)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(ta_agent_response_latency_seconds_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ta_agent_response_latency_seconds_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(ta_agent_response_latency_seconds_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests per second (by mode)",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (mode) (rate(ta_agent_response_latency_seconds_count[5m]))",
              "legendFormat": "{{mode}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Active sessions",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ta_agent_active_sessions)"
            }
          ]
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Avg tokens / request (5m)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5000
                  },
                  {
                    "color": "red",
                    "value": 15000
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(ta_agent_llm_tokens_total[5m])) / clamp_min(sum(rate(ta_agent_response_latency_seconds_count[5m])), 0.001)"
            }
          ]
        },
        {
          "id": 101,
          "type": "row",
          "title": "ReAct & Prompts",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "collapsed": false
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "ReAct turns per run (mode=$mode)",
          "description": "1 リクエストで Agent が呼んだ tool 数. 高すぎると冗長呼出の兆候.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(ta_agent_react_turns_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ta_agent_react_turns_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(ta_agent_react_turns_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Instructions length (chars, mode=$mode)",
          "description": "build_instructions が生成する system + skill 注入後のプロンプト長. mode 比較で skill 注入の偏りを観測.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le, mode) (rate(ta_agent_prompt_chars_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "{{mode}} p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le, mode) (rate(ta_agent_prompt_chars_bucket{mode=~\"$mode\"}[5m])))",
              "legendFormat": "{{mode}} p95"
            }
          ]
        },
        {
          "id": 102,
          "type": "row",
          "title": "Tools",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "collapsed": false
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Tool invocations (by tool, outcome)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 19
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (tool, outcome) (rate(ta_agent_tool_invocations_total[5m]))",
              "legendFormat": "{{tool}} ({{outcome}})"
            }
          ]
        },
        {
          "id": 7,
          "type": "barchart",
          "title": "Top 10 most used tools (range)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 19
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "orientation": "horizontal"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (tool) (increase(ta_agent_tool_invocations_total[$__range])))",
              "legendFormat": "{{tool}}",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Tool error rate (5m)",
          "description": "outcome != 'ok' の割合. 0.05 (5%) 超で要警戒.",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(ta_agent_tool_invocations_total{outcome!=\"ok\"}[5m])) / clamp_min(sum(rate(ta_agent_tool_invocations_total[5m])), 0.001)"
            }
          ]
        },
        {
          "id": 103,
          "type": "row",
          "title": "Skills picked",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "collapsed": false
        },
        {
          "id": 10,
          "type": "barchart",
          "title": "Top skills picked (range)",
          "description": "SkillRetriever が選んだ skill の頻度. 常時注入 (cost-aware-query / explain-*) は上位に出やすい.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "orientation": "horizontal"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(15, sum by (skill) (increase(ta_skill_hit_total[$__range])))",
              "legendFormat": "{{skill}}",
              "instant": true
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Skill picks rate (by skill, mode=$mode)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (skill) (rate(ta_skill_hit_total{mode=~\"$mode\"}[5m]))",
              "legendFormat": "{{skill}}"
            }
          ]
        },
        {
          "id": 104,
          "type": "row",
          "title": "LLM Tokens (cost)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 40
          },
          "collapsed": false
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "LLM tokens per second (by kind, model)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 41
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (kind, model) (rate(ta_agent_llm_tokens_total[5m]))",
              "legendFormat": "{{kind}} ({{model}})"
            }
          ]
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Tokens consumed (range)",
          "description": "ダッシュボード時間範囲で消費した累積トークン (input/output 別).",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 41
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "orientation": "vertical",
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (kind) (increase(ta_agent_llm_tokens_total[$__range]))",
              "legendFormat": "{{kind}}",
              "instant": true
            }
          ]
        },
        {
          "id": 105,
          "type": "row",
          "title": "Upstream HTTP (ta-agent → mcp-grafana / Grafana / OCI)",
          "description": "ta-agent の httpx clientから外部への HTTP 呼出. 「反応が遅い」 調査の起点. otel httpx instrumentation 由来.",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 49
          },
          "collapsed": false
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Upstream HTTP latency p50/p95/p99 (ta-agent)",
          "description": "ta-agent → 外部 HTTP の応答時間. 上昇したら mcp-grafana / Grafana / OCI のいずれかが詰まっている.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 50
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_client_duration_milliseconds_bucket{job=\"ta-agent\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_client_duration_milliseconds_bucket{job=\"ta-agent\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_client_duration_milliseconds_bucket{job=\"ta-agent\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Upstream HTTP requests/s by status code (ta-agent)",
          "description": "5xx / 4xx の急増は上流 (mcp-grafana, Grafana, OCI) の異常を示す.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 50
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (http_status_code) (rate(http_client_duration_milliseconds_count{job=\"ta-agent\"}[5m]))",
              "legendFormat": "{{http_status_code}}"
            }
          ]
        },
        {
          "id": 22,
          "type": "stat",
          "title": "Upstream HTTP error rate (5m)",
          "description": "status >= 400 の割合. 0.05 (5%) 超で要警戒.",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 58
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_client_duration_milliseconds_count{job=\"ta-agent\",http_status_code=~\"4..|5..\"}[5m])) / clamp_min(sum(rate(http_client_duration_milliseconds_count{job=\"ta-agent\"}[5m])), 0.001)"
            }
          ]
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Avg upstream latency (5m)",
          "description": "平均応答時間. 急上昇は上流の bottleneck を示す.",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 58
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 500
                  },
                  {
                    "color": "red",
                    "value": 2000
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_client_duration_milliseconds_sum{job=\"ta-agent\"}[5m])) / clamp_min(sum(rate(http_client_duration_milliseconds_count{job=\"ta-agent\"}[5m])), 0.001)"
            }
          ]
        },
        {
          "id": 24,
          "type": "stat",
          "title": "Upstream HTTP req rate (5m)",
          "description": "ta-agent から外部への HTTP コール頻度.",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 58
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_client_duration_milliseconds_count{job=\"ta-agent\"}[5m]))"
            }
          ]
        }
      ]
    }
