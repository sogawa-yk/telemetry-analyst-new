apiVersion: v1
kind: ConfigMap
metadata:
  name: ta-agent-config
  namespace: telemetry-analyst
  labels:
    app: ta-agent
data:
  # OCI Enterprise AI (Responses / Conversations API)
  OPENAI_BASE_URL: "https://inference.generativeai.ap-osaka-1.oci.oraclecloud.com/openai/v1"
  OCI_GENAI_PROJECT: "ocid1.generativeaiproject.oc1.ap-osaka-1.amaaaaaassl65iqak67q6dr5zu6jqoimgf54sylota5devqglzkkoenxznxa"
  OCI_GENAI_MODEL: "openai.gpt-4.1"

  # Langfuse
  LANGFUSE_HOST: "http://langfuse-web.langfuse.svc.cluster.local:3000"

  # OpenTelemetry
  OTEL_SERVICE_NAME: "ta-agent"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-gateway-opentelemetry-collector.observability:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

  # Grafana MCP: Responses API から外部経由で到達させるため公開 URL を指定
  # mcp-grafana は --transport=streamable-http 起動 (default endpoint path: /mcp)
  MCP_GRAFANA_URL: "https://ta-mcp.sogawa-yk.com/mcp"
  MCP_GRAFANA_ENABLED: "true"
  # Grafana の Service 名は kube-prometheus-stack の prometheus-grafana
  # (port 3000 を明示しないと別ポートに飛んで timeout する)
  GRAFANA_URL: "http://prometheus-grafana.observability.svc.cluster.local:3000"
  GRAFANA_EXTERNAL_URL: "https://grafana.sogawa-yk.com"

  # 監視対象
  TA_TARGET_NAMESPACE: "ec-shop"

  # ガードレール
  TA_MAX_TOOL_CALLS: "20"
  TA_REQUEST_TIMEOUT_SEC: "120"
  TA_DEFAULT_MODE: "engineer"
  TA_LOG_LEVEL: "INFO"

  # UI → API
  TA_AGENT_URL: "http://ta-agent.telemetry-analyst.svc:8080"
