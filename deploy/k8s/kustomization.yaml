apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Note: 全体に `namespace:` をかけると ec-shop 向けの Role/RoleBinding まで
# telemetry-analyst に書き換えられてしまうので使わない.
# 各マニフェストで namespace を明示している.
resources:
  - namespace.yaml
  - configmap.yaml
  - rbac.yaml
  - deployment-mcp-grafana.yaml
  - deployment-api.yaml
  - deployment-ui.yaml
  - service.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: telemetry-analyst
    includeSelectors: false
