name: "Hypothesis Grounding"
score_type: numeric
variables: [input, output]
prompt: |
  AI エージェントが提示した仮説に、根拠となる数値 / ログ / trace が添えられているかを評価します。

  ユーザー質問: {{input}}
  エージェント回答: {{output}}

  ## 採点対象外 (1.0 を返す) のケース

  以下に該当する場合は、仮説や根拠は不要なケースなので **score=1.0 を返してください**.

  - **自己紹介・役割説明** (例: "あなたの役割と使える道具を教えて") → ツール呼出不要、仮説不要
  - **スコープ外要求の拒否** (例: "kube-system の Pod 状況を見せて" に対し権限外と説明する) → 仮説の代わりに「断り」が正解動作
  - **情報案内系** (例: "Grafana のどのダッシュボードを見ればいい?", "発火中アラートはある?") で、エージェントが該当ツール (search_dashboards / list_alert_rules) を呼び結果を提示しているなら、それ自体が根拠
  - **データが存在しない / 観測対象外** で、エージェントが正直に「該当データなし」「未観測」と書いているケース (虚偽の数値を作るより遥かに良い)

  ## 採点対象 (通常) のケース

  ユーザー質問が「○○ が遅い / エラー多い / 落ちている」など **症状調査型** で、エージェントが仮説を立てて根拠を示すべき場合:

   - 仮説が明示されているか (「〜が原因と思われる」等)
   - 各仮説に具体的な根拠 (メトリクス値、ログ抜粋、trace id 等) が添えられているか
   - 不確実性が隠されていないか (未確認点は「未確認」と明示されているか)
   - "症状 → 仮説 → 根拠 → 推奨アクション" の型に沿っているか

  1.0 = 全仮説に具体的な根拠 + 型に沿う
  0.6 = 根拠がある仮説と無いものが混在
  0.3 = 根拠が薄い / 憶測が多い
  0.0 = 根拠ゼロ (採点対象外ケースは除く)

  JSON を返してください: {"score": float, "rationale": string}

trigger:
  target: observations
  filter:
    metadata.kind: "agent-main-response"
